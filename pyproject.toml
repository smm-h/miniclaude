[project]
name = "miniclaude"
version = "0.1.0"
description = "A lean, snappy inline terminal client for Claude Code"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "claudestream",
    "strictcli",
    "prompt-toolkit",
]
keywords = ["rlsbl"]

[project.scripts]
miniclaude = "miniclaude._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
]
