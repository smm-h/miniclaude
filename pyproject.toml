[project]
name = "miniclaude"
version = "0.2.1"
description = "A lean, snappy fullscreen terminal client for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "claudestream",
    # Floor, not a pin. 0.41.0 makes presence a mandatory declaration, bans a
    # value default on a mutating command, replaces bare `choices=` entries
    # with records and retires MutexGroup in favour of member-spelled choice
    # flags; 0.41.1 lets a member of a member-spelled choice carry a short.
    # `_cli.py` is written against all of it, and an older strictcli has no
    # `presence=` keyword at all.
    "strictcli>=0.41.1",
    "prompt-toolkit",
]
keywords = ["rlsbl"]

[project.urls]
Homepage = "https://github.com/smm-h/miniclaude"
Repository = "https://github.com/smm-h/miniclaude"
Issues = "https://github.com/smm-h/miniclaude/issues"

[project.scripts]
miniclaude = "miniclaude._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyte>=0.8.2",
    "pytest",
    "pytest-timeout",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that spawn a real Claude CLI in a pty (slow, network)",
    "pty: tests that drive a miniclaude command inside a pseudo-terminal (no live CLI/profile/network needed)",
]
